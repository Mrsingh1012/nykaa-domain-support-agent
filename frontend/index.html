<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nykaa AI Support</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <header class="chat-header">
            <div class="logo">N</div>

            <div class="header-info">
                <h1>Nykaa AI Support</h1>
                <p>AI-powered customer assistance</p>
            </div>

            <span class="status">● Online</span>
        </header>

        <main id="chat-box" class="chat-box">

            <div class="message bot">
                Hello! 👋 Welcome to Nykaa Support.

                <br><br>

                How can I help you today?

                <br><br>

                You can ask about:
                <br>
                📦 Order tracking
                <br>
                🔄 Refund policy
                <br>
                🚚 Delivery information
            </div>

        </main>

        <form id="chat-form" class="chat-form">

            <input type="text" id="question" placeholder="Type your question..." maxlength="2000" required>

            <button type="submit" id="send-button">
                Send
            </button>

        </form>

        <footer>
            AI-generated responses may require verification.
        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
